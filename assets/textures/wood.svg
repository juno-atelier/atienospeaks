<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Procedural walnut wood grain. Tiled as a section background,
       then tinted navy by the overlay in home.css. No raster download. -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <!-- Stretched fractal noise = long directional grain -->
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="5" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.34
                0 0 0 0 0.22
                0 0 0 0 0.12
                0 0 0 0.9 0.1" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="420" height="420" fill="#4a331f"/>
  <rect width="420" height="420" filter="url(#grain)" opacity="0.85"/>
  <!-- A few darker plank seams -->
  <g stroke="#2e2013" stroke-width="2" opacity="0.5">
    <line x1="0" y1="104" x2="420" y2="100"/>
    <line x1="0" y1="232" x2="420" y2="236"/>
    <line x1="0" y1="348" x2="420" y2="344"/>
  </g>
</svg>
